<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Recipe Book</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🍳 Culinary Keep</h1>
        <p>Your personal digital recipe organizer</p>
    </header>

    <main class="container">
        <section class="recipe-form-section">
            <h2>Add a New Recipe</h2>
            <form id="recipe-form">
                <div class="form-group">
                    <label for="recipe-title">Recipe Title</label>
                    <input type="text" id="recipe-title" placeholder="e.g., Classic Chocolate Chip Cookies" required>
                </div>

                <div class="form-group">
                    <label for="recipe-image">Image URL</label>
                    <input type="url" id="recipe-image" placeholder="Paste an image web link (optional)">
                </div>

                <div class="form-group">
                    <label for="recipe-ingredients">Ingredients</label>
                    <textarea id="recipe-ingredients" rows="4" placeholder="Enter ingredients (one per line)" required></textarea>
                </div>

                <div class="form-group">
                    <label for="recipe-instructions">Instructions</label>
                    <textarea id="recipe-instructions" rows="4" placeholder="Describe the steps to cook..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Save Recipe</button>
            </form>
        </section>

        <section class="recipe-display-section">
            <h2>Your Recipes</h2>
            <div id="recipes-container" class="recipes-grid">
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
